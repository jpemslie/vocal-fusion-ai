<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VocalFusion</title>
<style>
  body { font-family: monospace; max-width: 560px; margin: 80px auto; padding: 0 20px; background: #fff; color: #111; }
  h1 { font-size: 1.3em; margin-bottom: 32px; }
  label { display: block; margin: 18px 0 4px; font-size: .85em; letter-spacing: .05em; text-transform: uppercase; }
  input[type=file] { display: block; width: 100%; }
  button { margin-top: 28px; padding: 10px 32px; font-size: 1em; cursor: pointer; font-family: monospace; }
  button:disabled { opacity: .4; cursor: default; }
  #status { margin-top: 20px; font-size: .85em; color: #555; min-height: 1.2em; }
  progress { width: 100%; margin-top: 8px; display: none; }
  audio { margin-top: 24px; width: 100%; display: none; }
  .err { color: #c00; }
</style>
</head>
<body>
<h1>VocalFusion</h1>

<label>Song A — Beat / Instrumental</label>
<input type="file" id="songA" accept="audio/*">

<label>Song B — Vocal Source</label>
<input type="file" id="songB" accept="audio/*">

<button id="btn" onclick="startFuse()">Fuse</button>

<div id="status"></div>
<progress id="bar" max="100"></progress>
<audio id="player" controls></audio>

<script>
let pollId = null;

async function startFuse() {
  const a = document.getElementById('songA').files[0];
  const b = document.getElementById('songB').files[0];
  if (!a || !b) { alert('Select both files first.'); return; }

  clearInterval(pollId);
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('player').style.display = 'none';
  document.getElementById('bar').style.display = 'block';
  setStatus('Uploading…', 0);

  const fd = new FormData();
  fd.append('song_a', a);
  fd.append('song_b', b);

  let res, data;
  try {
    res = await fetch('/fuse', { method: 'POST', body: fd });
    data = await res.json();
  } catch (e) {
    setStatus('Upload error: ' + e, 0, true);
    btn.disabled = false;
    return;
  }
  if (!res.ok) { setStatus(data.error || 'Server error', 0, true); btn.disabled = false; return; }

  pollId = setInterval(() => poll(data.job_id, btn), 1500);
}

async function poll(job_id, btn) {
  let job;
  try {
    const r = await fetch('/status/' + job_id);
    job = await r.json();
  } catch { return; }

  setStatus(job.message, job.progress, job.status === 'error');

  if (job.status === 'done') {
    clearInterval(pollId);
    document.getElementById('bar').style.display = 'none';
    const player = document.getElementById('player');
    player.src = job.output_url;
    player.style.display = 'block';
    player.play().catch(() => {});
    btn.disabled = false;
  } else if (job.status === 'error') {
    clearInterval(pollId);
    document.getElementById('bar').style.display = 'none';
    btn.disabled = false;
  }
}

function setStatus(msg, pct, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg || '';
  el.className = isErr ? 'err' : '';
  if (pct !== undefined) document.getElementById('bar').value = pct;
}
</script>
</body>
</html>
